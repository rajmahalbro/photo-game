<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Photo Game Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .btn{width:auto;padding:12px 18px;font-size:16px;display:inline-block}
  .btn.sm{padding:9px 14px;font-size:15px}
  .btn.on{outline:3px solid var(--ink)}
  .btn.ghost{color:var(--ink) !important}
  body{min-height:100vh}
  .btn.danger{background:#e5484d;color:#fff}
  .wrap{max-width:1200px;margin:0 auto;padding:16px 20px 40px}
  .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .top h1{margin:0;font-size:26px;color:var(--accent);flex:1;min-width:200px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,select{font:600 16px Inter;padding:10px 12px;border-radius:12px;border:2px solid var(--muted);background:var(--bg);color:var(--ink)}
  #evName{flex:1;min-width:200px}
  #mins{width:80px;text-align:center}
  #clock{font-family:var(--display);font-size:34px;min-width:110px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .ph{background:var(--bg);border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid transparent;position:relative}
  .ph.star{border-color:var(--accent)}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0003}
  .ph .t{padding:8px 10px;font-weight:800}
  .ph .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#111;font-weight:800;border-radius:999px;padding:3px 9px;display:none}
  .ph.star .badge{display:block}
  .muted{color:var(--muted);font-size:14px}
  .pin{max-width:320px;margin:18vh auto;text-align:center;padding:0 18px}
  .pin input{width:100%;font-size:30px;text-align:center;margin:14px 0}
  .pin .btn{width:100%}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:var(--card);border-radius:18px;padding:24px;max-width:380px;width:100%;text-align:center}
  .modal h3{margin:0 0 8px;font-size:22px}
  .modal p{color:var(--muted);margin:0 0 18px}
</style></head>
<body class="retro">
<div class="pin" id="pinBox">
  <h1 class="display">Photo Game</h1>
  <p>Dashboard. Enter your PIN.</p>
  <input id="pin" type="password" inputmode="numeric">
  <button class="btn" id="go">Open dashboard</button>
  <p id="pinMsg"></p>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <h1 id="title"></h1>
    <button class="btn" id="openScreen">Open audience screen ↗</button>
  </div>

  <div class="card">
    <h3>Event</h3>
    <div class="row">
      <input id="evName" placeholder="Company / event name">
      <select id="evTheme"><option value="retro">Retro</option><option value="glitz">Glitz Gala</option><option value="noir">Noir</option><option value="clean">Clean</option></select>
      <button class="btn sm" id="switchEv">Switch event</button>
    </div>
    <p class="muted">Each event name gets its own Google Drive folder.</p>
  </div>

  <div class="card">
    <h3>Audience screen</h3>
    <div class="row">
      <button class="btn sm ghost" data-view="blank">Title</button>
      <button class="btn sm ghost" data-view="qr">QR + timer</button>
      <button class="btn sm ghost" data-view="top">Top 3</button>
    </div>
    <div class="row" style="margin-top:12px">
      <span id="clock">3:00</span>
      <button class="btn sm ghost" data-min="1">1 min</button>
      <button class="btn sm ghost" data-min="3">3 min</button>
      <button class="btn sm ghost" data-min="5">5 min</button>
      <input id="mins" type="number" min="0.5" step="0.5" title="Custom minutes"> <span class="muted">min</span>
      <button class="btn sm" id="tStart">Start</button>
      <button class="btn sm ghost" id="tPause">Pause</button>
      <button class="btn sm ghost" id="tReset">Reset</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h3 style="margin:0">Photos · <span id="count">0</span></h3>
      <span class="muted">Tap up to 3 photos to pick the Top 3. New photos appear automatically.</span>
      <button class="btn sm danger" id="delAll">Delete all photos</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="row" style="justify-content:center">
    <button class="btn ghost" id="mNo">Cancel</button>
    <button class="btn danger" id="mYes"></button>
  </div>
</div></div>

<script src="qrcode.js"></script>
<script src="common.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var Q = new URLSearchParams(location.search);
  var saved = {}; try { saved = JSON.parse(localStorage.getItem('rm-photo-last') || '{}'); } catch (x) {}
  var st = { event: cleanEvent(Q.get('event') || saved.event), theme: cleanTheme(Q.get('theme') || saved.theme), view: 'qr',
             timer: { total: 180000, endAt: 0, left: 180000, running: false }, top: [] };
  var PIN = '', seen = {}, stars = [], poll = null;
  var ch = new BroadcastChannel('rajmahal-photo');
  ch.onmessage = function (e) { if (e.data && e.data.type === 'hello') send(); };
  function send() { ch.postMessage({ type: 'state', state: st }); }

  function applyEvent() {
    document.body.className = st.theme;
    $('title').textContent = st.event + ' · Photo Game';
    document.title = st.event + ' · Dashboard';
    $('evName').value = st.event; $('evTheme').value = st.theme;
    history.replaceState(null, '', '?' + new URLSearchParams({ event: st.event, theme: st.theme }).toString());
    try { localStorage.setItem('rm-photo-last', JSON.stringify({ event: st.event, theme: st.theme })); } catch (x) {}
  }

  // PIN
  try { PIN = sessionStorage.getItem('rm-pin') || ''; } catch (x) {}
  $('go').onclick = function () { PIN = $('pin').value.trim(); start(); };
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
  function start() {
    api({ action: 'list', event: st.event, pin: PIN }).then(function (list) {
      try { sessionStorage.setItem('rm-pin', PIN); } catch (x) {}
      $('pinBox').style.display = 'none'; $('app').style.display = 'block';
      applyEvent(); paintView(); paintClock(); render(list); send();
      clearInterval(poll); poll = setInterval(refresh, 8000);
    }).catch(function () { $('pinBox').style.display = 'block'; $('pinMsg').textContent = PIN ? 'Wrong PIN, try again.' : ''; });
  }
  if (PIN) start();

  // Event switch
  $('switchEv').onclick = function () {
    st.event = cleanEvent($('evName').value); st.theme = cleanTheme($('evTheme').value);
    seen = {}; stars = []; st.top = []; $('grid').innerHTML = ''; $('count').textContent = '0';
    applyEvent(); send(); refresh();
  };

  // Screen window
  $('openScreen').onclick = function () {
    window.open('screen.html?' + new URLSearchParams({ event: st.event, theme: st.theme }).toString(),
                'rajmahal-screen', 'popup,width=1280,height=720');
    setTimeout(send, 800);
  };
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.onclick = function () { st.view = b.dataset.view; paintView(); send(); };
  });
  function paintView() { document.querySelectorAll('[data-view]').forEach(function (b) { b.classList.toggle('on', b.dataset.view === st.view); }); }

  // Timer
  function setTotal(min) { var ms = Math.round(min * 60000); if (!(ms > 0)) return;
    st.timer = { total: ms, endAt: 0, left: ms, running: false }; $('mins').value = min; paintClock(); send(); }
  document.querySelectorAll('[data-min]').forEach(function (b) { b.onclick = function () { setTotal(+b.dataset.min); }; });
  $('mins').onchange = function () { setTotal(parseFloat($('mins').value)); };
  $('tStart').onclick = function () { var t = st.timer; if (t.running) return; if (t.left <= 0) t.left = t.total;
    t.endAt = Date.now() + t.left; t.running = true; send(); };
  $('tPause').onclick = function () { var t = st.timer; if (!t.running) return; t.left = Math.max(0, t.endAt - Date.now()); t.running = false; send(); };
  $('tReset').onclick = function () { setTotal(st.timer.total / 60000); };
  function paintClock() { var t = st.timer, left = t.running ? t.endAt - Date.now() : t.left;
    $('clock').textContent = left <= 0 ? "Time's up" : fmtTime(left);
    if (t.running && left <= 0) { t.running = false; t.left = 0; send(); } }
  setInterval(function () { if ($('app').style.display !== 'none') paintClock(); }, 250);
  $('mins').value = st.timer.total / 60000;

  // Photos
  function refresh() { api({ action: 'list', event: st.event, pin: PIN }).then(render).catch(function () {}); }
  function render(list) {
    $('count').textContent = list.length;
    list.slice().reverse().forEach(function (p) {
      if (seen[p.id]) return;
      var c = document.createElement('div'); c.className = 'ph';
      c.innerHTML = '<span class="badge"></span><img alt=""><div class="t"></div>';
      c.querySelector('.t').textContent = 'Table ' + p.table;
      c.onclick = function () { toggle(p.id); };
      $('grid').insertBefore(c, $('grid').firstChild);
      seen[p.id] = { table: p.table, card: c, src: null };
      var ev = st.event;
      api({ action: 'photo', event: ev, pin: PIN, id: p.id }).then(function (src) {
        if (!seen[p.id]) return; seen[p.id].src = src; c.querySelector('img').src = src; syncTop(); });
    });
  }
  function toggle(id) {
    var i = stars.indexOf(id);
    if (i >= 0) stars.splice(i, 1); else if (stars.length < 3) stars.push(id); else return;
    Object.keys(seen).forEach(function (k) { var n = stars.indexOf(k), c = seen[k].card;
      c.classList.toggle('star', n >= 0); c.querySelector('.badge').textContent = n >= 0 ? '#' + (n + 1) : ''; });
    syncTop();
  }
  function syncTop() { st.top = stars.map(function (id) { return { table: seen[id].table, src: seen[id].src }; }); send(); }

  // Delete all (two confirmations)
  var step = 0;
  function closeModal() { $('modal').style.display = 'none'; step = 0; $('mYes').disabled = false; }
  $('mNo').onclick = closeModal;
  $('delAll').onclick = function () { step = 1;
    $('mTitle').textContent = 'Delete all photos?';
    $('mText').textContent = 'This removes every photo for ' + st.event + ' (' + Object.keys(seen).length + ' photos).';
    $('mYes').textContent = 'Delete'; $('modal').style.display = 'flex'; };
  $('mYes').onclick = function () {
    if (step === 1) { step = 2; $('mTitle').textContent = 'Are you sure you want to delete?';
      $('mText').textContent = 'They go to your Google Drive bin (recoverable for 30 days).';
      $('mYes').textContent = 'Yes, delete them all'; return; }
    $('mYes').disabled = true; $('mYes').textContent = 'Deleting…';
    api({}, { action: 'clear', event: st.event, pin: PIN }).then(function (n) {
      $('grid').innerHTML = ''; seen = {}; stars = []; st.top = []; send(); $('count').textContent = '0';
    }).catch(function (err) { alert('Delete failed: ' + err.message); }).then(closeModal);
  };
</script>
</body></html>
