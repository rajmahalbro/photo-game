<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Table Photo</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1d1433;--card:#2a1d4a;--ink:#fff6e5;--muted:#d9c9a8;--accent:#ff8a1f;--accent2:#19c3b1;--display:'Righteous',cursive}
  body.glitz{--bg:#0b0b0b;--card:#17140c;--ink:#fbf3dc;--muted:#c9b88a;--accent:#d4af37;--accent2:#f5d97a;--display:'Playfair Display',serif}
  body.noir{--bg:#0a0a0a;--card:#1a1a1a;--ink:#ffffff;--muted:#bdbdbd;--accent:#ffffff;--accent2:#9e9e9e;--display:'Playfair Display',serif}
  body.clean{--bg:#f5f6f8;--card:#ffffff;--ink:#16181d;--muted:#5b6170;--accent:#2b59ff;--accent2:#00a37a;--display:'Inter',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  body.retro{background:radial-gradient(circle at 20% 0%,#3b2470 0,var(--bg) 60%)}
  h1,.display{font-family:var(--display);letter-spacing:.5px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:800 20px 'Inter',sans-serif;background:var(--accent);color:#14101f;cursor:pointer}
  body.noir .btn,body.glitz .btn{color:#0b0b0b}
  body.clean .btn{color:#fff}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
</style>

<style>
  .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;flex-wrap:wrap}
  .bar h1{margin:0;font-size:26px;color:var(--accent)}
  .bar .count{color:var(--muted)}
  .bar .btn{width:auto;padding:12px 20px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:0 20px 30px}
  .card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:3px solid transparent;position:relative}
  .card.star{border-color:var(--accent)}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0003}
  .card .t{padding:8px 12px;font-weight:800;font-size:18px}
  .card .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#111;font-weight:800;border-radius:999px;padding:4px 10px;display:none}
  .card.star .badge{display:block}
  .pin{max-width:320px;margin:20vh auto;text-align:center;padding:0 18px}
  .pin input{width:100%;font:800 32px 'Inter';text-align:center;padding:12px;border-radius:14px;border:2px solid var(--muted);background:var(--card);color:var(--ink);margin:16px 0}
  .bar .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn.danger{background:#e5484d;color:#fff}
  .qr{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer}
  .qr h2{font-family:var(--display);font-size:6vh;margin:0;color:var(--accent)}
  .qr p{font-size:3vh;margin:0;color:var(--ink)}
  .qr #qrBox{background:#fff;padding:2.5vh;border-radius:20px}
  .qr #qrBox svg{width:52vh;height:52vh;display:block}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:var(--card);border-radius:18px;padding:24px;max-width:380px;width:100%;text-align:center}
  .modal .box h3{margin:0 0 8px;font-size:22px}
  .modal .box p{color:var(--muted);margin:0 0 18px}
  .modal .row2{display:flex;gap:10px}
  .reveal{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:3vh 3vw}
  .reveal h2{font-family:var(--display);text-align:center;font-size:5vh;margin:0 0 2vh;color:var(--accent)}
  .reveal .row{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;min-height:0}
  .reveal .row div{display:flex;flex-direction:column;min-height:0}
  .reveal img{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:16px}
  .reveal p{font-family:var(--display);text-align:center;font-size:4.5vh;margin:1.5vh 0 0}
  .hint{color:var(--muted);padding:0 20px 10px;font-size:14px}
</style></head>
<body class="retro">
<div class="pin" id="pinBox">
  <h1 class="display"><span class="ev"></span></h1>
  <p>Photo gallery. Enter your PIN.</p>
  <input id="pin" type="password" inputmode="numeric">
  <button class="btn" id="go">Open gallery</button>
  <p id="pinMsg"></p>
</div>
<div id="app" style="display:none">
  <div class="bar">
    <h1><span class="ev"></span> · Table Photos</h1>
    <span class="count" id="count">0 photos</span>
    <div class="btns">
      <button class="btn" id="showQr">Show QR on screen</button>
      <button class="btn" id="showTop">Show Top 3 on screen</button>
      <button class="btn danger" id="delAll">Delete all photos</button>
    </div>
  </div>
  <p class="hint">Tap a photo to pick it for the Top 3 (tap again to remove). New photos appear automatically.</p>
  <div class="grid" id="grid"></div>
</div>
<div class="qr" id="qrScreen">
  <h2>Retro Table Photo</h2>
  <div id="qrBox"></div>
  <p>Scan · type your <b>table number</b> · send <b>one</b> photo</p>
</div>
<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="row2">
      <button class="btn ghost" id="mNo">Cancel</button>
      <button class="btn danger" id="mYes"></button>
    </div>
  </div>
</div>
<div class="reveal" id="reveal">
  <h2>Our Top 3 Tables</h2>
  <div class="row" id="revealRow"></div>
</div>
<script src="qrcode.js"></script>
<script>

  var EXEC = 'https://script.google.com/macros/s/AKfycbwQ655otHkKiDgf3yTFR2SjloXX1K-gqqN3W__pvFCsiYKw5GhkcxPbwVb7eNDvDoTc/exec';
  var Q = new URLSearchParams(location.search);
  var EVENT = (Q.get('event') || 'My Event').replace(/[^\w &'().-]/g, '').trim().slice(0, 60) || 'My Event';
  var THEME = ['retro','glitz','noir','clean'].indexOf(Q.get('theme')) >= 0 ? Q.get('theme') : 'retro';
  document.body.className = THEME;
  document.title = EVENT + ' · Table Photo';
  document.querySelectorAll('.ev').forEach(function(n){ n.textContent = EVENT; });
  function api(params, body){
    var url = EXEC + '?' + new URLSearchParams(params).toString();
    return fetch(url, body ? {method:'POST', body: JSON.stringify(body)} : {})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.data; });
  }
  var PIN = '', seen = {}, stars = [];
  var $ = function(id){ return document.getElementById(id); };
  function run(fn, ev, pin, id){
    return fn === 'listPhotos' ? api({action:'list', event: ev, pin: pin})
                               : api({action:'photo', event: ev, pin: pin, id: id}); }
  $('go').onclick = function(){
    PIN = $('pin').value.trim();
    run('listPhotos', EVENT, PIN).then(function(list){
      $('pinBox').style.display = 'none'; $('app').style.display = 'block';
      render(list); setInterval(refresh, 8000);
    }).catch(function(){ $('pinMsg').textContent = 'Wrong PIN, try again.'; });
  };
  function refresh(){ run('listPhotos', EVENT, PIN).then(render).catch(function(){}); }
  function render(list){
    $('count').textContent = list.length + (list.length === 1 ? ' photo' : ' photos');
    list.slice().reverse().forEach(function(p){
      if (seen[p.id]) return;
      var card = document.createElement('div');
      card.className = 'card'; card.dataset.id = p.id;
      card.innerHTML = '<span class="badge"></span><img alt=""><div class="t"></div>';
      card.querySelector('.t').textContent = 'Table ' + p.table;
      card.onclick = function(){ toggle(p, card); };
      $('grid').insertBefore(card, $('grid').firstChild);
      seen[p.id] = { table: p.table, card: card, src: null };
      run('getPhoto', EVENT, PIN, p.id).then(function(src){
        seen[p.id].src = src; card.querySelector('img').src = src; });
    });
  }
  function toggle(p, card){
    var i = stars.indexOf(p.id);
    if (i >= 0) stars.splice(i, 1);
    else { if (stars.length >= 3) return alertBar(); stars.push(p.id); }
    Object.keys(seen).forEach(function(id){
      var k = stars.indexOf(id), c = seen[id].card;
      c.classList.toggle('star', k >= 0); c.querySelector('.badge').textContent = k >= 0 ? '#' + (k + 1) : '';
    });
  }
  function alertBar(){ $('count').textContent = 'Top 3 already picked. Tap one to remove it first.'; }
  $('showTop').onclick = function(){
    if (!stars.length) return;
    $('revealRow').innerHTML = '';
    $('revealRow').style.gridTemplateColumns = 'repeat(' + stars.length + ',1fr)';
    stars.forEach(function(id){
      var d = document.createElement('div'), img = document.createElement('img'), p = document.createElement('p');
      img.src = seen[id].src || ''; p.textContent = 'Table ' + seen[id].table;
      d.appendChild(img); d.appendChild(p); $('revealRow').appendChild(d);
    });
    $('reveal').style.display = 'flex';
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  };
  $('reveal').onclick = function(){ $('reveal').style.display = 'none';
    if (document.fullscreenElement) document.exitFullscreen(); };
  // QR screen
  var qrMade = false;
  $('showQr').onclick = function(){
    var guest = location.href.split('gallery.html')[0] + '?' + new URLSearchParams({event: EVENT, theme: THEME}).toString();
    $('qrScreen').querySelector('h2').textContent = EVENT + ' · Table Photo';
    if (!qrMade && window.qrcode) { var q = qrcode(0, 'M'); q.addData(guest); q.make(); $('qrBox').innerHTML = q.createSvgTag({cellSize: 8, margin: 0}); qrMade = true; }
    $('qrScreen').style.display = 'flex';
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  };
  $('qrScreen').onclick = function(){ $('qrScreen').style.display = 'none';
    if (document.fullscreenElement) document.exitFullscreen(); };

  // Delete all, with two confirmations
  var step = 0;
  function closeModal(){ $('modal').style.display = 'none'; step = 0; }
  $('mNo').onclick = closeModal;
  $('delAll').onclick = function(){
    step = 1;
    $('mTitle').textContent = 'Delete all photos?';
    $('mText').textContent = 'This removes every photo for ' + EVENT + ' (' + Object.keys(seen).length + ' photos).';
    $('mYes').textContent = 'Delete';
    $('modal').style.display = 'flex';
  };
  $('mYes').onclick = function(){
    if (step === 1) {
      step = 2;
      $('mTitle').textContent = 'Are you sure you want to delete?';
      $('mText').textContent = 'They go to your Google Drive bin (recoverable for 30 days).';
      $('mYes').textContent = 'Yes, delete them all';
      return;
    }
    $('mYes').disabled = true; $('mYes').textContent = 'Deleting…';
    api({}, {action: 'clear', event: EVENT, pin: PIN}).then(function(n){
      $('grid').innerHTML = ''; seen = {}; stars = [];
      $('count').textContent = n + ' photos deleted';
    }).catch(function(err){ $('count').textContent = 'Delete failed: ' + err.message; })
      .then(function(){ $('mYes').disabled = false; closeModal(); });
  };
</script>
</body></html>
