<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Table Photo</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1d1433;--card:#2a1d4a;--ink:#fff6e5;--muted:#d9c9a8;--accent:#ff8a1f;--accent2:#19c3b1;--display:'Righteous',cursive}
  body.glitz{--bg:#0b0b0b;--card:#17140c;--ink:#fbf3dc;--muted:#c9b88a;--accent:#d4af37;--accent2:#f5d97a;--display:'Playfair Display',serif}
  body.noir{--bg:#0a0a0a;--card:#1a1a1a;--ink:#ffffff;--muted:#bdbdbd;--accent:#ffffff;--accent2:#9e9e9e;--display:'Playfair Display',serif}
  body.clean{--bg:#f5f6f8;--card:#ffffff;--ink:#16181d;--muted:#5b6170;--accent:#2b59ff;--accent2:#00a37a;--display:'Inter',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  body.retro{background:radial-gradient(circle at 20% 0%,#3b2470 0,var(--bg) 60%)}
  h1,.display{font-family:var(--display);letter-spacing:.5px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font:800 20px 'Inter',sans-serif;background:var(--accent);color:#14101f;cursor:pointer}
  body.noir .btn,body.glitz .btn{color:#0b0b0b}
  body.clean .btn{color:#fff}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
</style>

<style>
  .wrap{max-width:440px;margin:0 auto;padding:28px 18px 40px;text-align:center}
  .event{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:2px;margin:0 0 6px}
  h1{font-size:34px;margin:0 0 24px;color:var(--accent)}
  label{display:block;text-align:left;font-weight:600;margin:0 0 8px;color:var(--muted)}
  input[type=number]{width:100%;font:800 40px 'Inter',sans-serif;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--muted);background:var(--card);color:var(--ink);margin-bottom:18px}
  .pick{position:relative;border:2px dashed var(--muted);border-radius:16px;background:var(--card);min-height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;cursor:pointer}
  .pick img{width:100%;max-height:38vh;object-fit:cover;display:block}
  .pick span{font-size:18px;font-weight:600;padding:20px}
  #file{display:none}
  .msg{min-height:24px;margin:14px 0 0;color:var(--muted)}
  .done{display:none;padding-top:60px}
  .done .big{font-size:72px}
</style></head>
<body class="retro">
<div class="wrap" id="form">
  <p class="event"><span class="ev"></span></p>
  <h1>Table Photo</h1>
  <label for="table">Your table number</label>
  <input id="table" type="number" inputmode="numeric" min="1" max="999" placeholder="">
  <div class="pick" id="pick"><span>📸 Tap to add your table photo</span></div>
  <input id="file" type="file" accept="image/*">
  <button class="btn" id="send" disabled>Send</button>
  <p class="msg" id="msg"></p>
</div>
<div class="wrap done" id="done">
  <div class="big">🕺</div>
  <h1>Got it!</h1>
  <p>Your table photo is in. Good luck, Table <b id="doneTable"></b>!</p>
</div>
<script>

  var EXEC = 'https://script.google.com/macros/s/AKfycbwQ655otHkKiDgf3yTFR2SjloXX1K-gqqN3W__pvFCsiYKw5GhkcxPbwVb7eNDvDoTc/exec';
  var Q = new URLSearchParams(location.search);
  var EVENT = (Q.get('event') || 'My Event').replace(/[^\w &'().-]/g, '').trim().slice(0, 60) || 'My Event';
  var THEME = ['retro','glitz','noir','clean'].indexOf(Q.get('theme')) >= 0 ? Q.get('theme') : 'retro';
  document.body.className = THEME;
  document.title = EVENT + ' · Table Photo';
  document.querySelectorAll('.ev').forEach(function(n){ n.textContent = EVENT; });
  function api(params, body){
    var url = EXEC + '?' + new URLSearchParams(params).toString();
    return fetch(url, body ? {method:'POST', body: JSON.stringify(body)} : {})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j.data; });
  }
  var photo = null;
  var $ = function(id){ return document.getElementById(id); };
  function ready(){ $('send').disabled = !(photo && $('table').value.trim()); }
  $('table').addEventListener('input', ready);
  $('pick').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    $('msg').textContent = 'Preparing photo…';
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function(){
      var max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      photo = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      $('pick').innerHTML = '<img alt="Your photo" src="' + photo + '">';
      $('msg').textContent = '';
      ready();
    };
    img.onerror = function(){ $('msg').textContent = 'Could not read that photo. Try another.'; };
    img.src = url;
  });
  $('send').addEventListener('click', function(){
    var table = $('table').value.trim();
    $('send').disabled = true; $('msg').textContent = 'Sending…';
    api({}, {action:'submit', event: EVENT, table: table, image: photo})
      .then(function(){
        $('doneTable').textContent = table;
        $('form').style.display = 'none'; $('done').style.display = 'block';
      })
      .catch(function(err){
        $('msg').textContent = (err && err.message) || 'Something went wrong. Please try again.';
        $('send').disabled = false;
      });
  });
</script>
</body></html>
